[package]
name = "tomidoro"
version = "0.1.2"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = { version = "0.29.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.3"


[profile.optbuild]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
